<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <!-- BACKGROUND GRID (ESTETIK) -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#000" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- <rect width="100%" height="100%" fill="url(#grid)" /> -->

  <!-- ICON (TOP LEFT) -->
   <g transform="translate(40 35)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TITLE -->
  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="72"
    font-weight="900"
    letter-spacing="10"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
    fill="#000">
    FREELANCE
  </text>

  <!-- SUBTLE LINE DECORATION -->
  <!-- <line x1="140" y1="130" x2="580" y2="130" stroke="#000" stroke-width="1" opacity="0.25"/> -->
</svg>
