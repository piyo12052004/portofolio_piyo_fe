<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170">
  <!-- Grid -->
  <defs>
    <pattern id="grid3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- <rect width="100%" height="100%" fill="url(#grid3)" /> -->

  <!-- Badge icon -->
   <g transform="translate(40 35)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text
    x="50%"
    y="58%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="72"
    font-weight="800"
    letter-spacing="5"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
    fill="#000">
    BBPVP BEKASI
