<svg
  width="1200"
  height="260"
  viewBox="0 0 1200 260"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Shadow / extrude -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="8" dy="8" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          0 0 0 0 0.45
          0 0 0 0 0.45
          0 0 0 0 0.45
          0 0 0 0.8 0"
        result="shadow"
      />
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional, bisa dihapus) -->
  <rect width="100%" height="100%" fill="#eeeeee"/>

  <!-- Text -->
  <text
    x="50%"
    y="60%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="160"
    font-weight="900"
    letter-spacing="12"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
    fill="#ffffff"
    stroke="#9ca3af"
    stroke-width="6"
    filter="url(#shadow)"
  >
    FRELACE
  </text>
</svg>
