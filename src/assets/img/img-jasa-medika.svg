<svg xmlns="http://www.w3.org/2000/svg" width="700" height="160" viewBox="0 0 700 160">
  <!-- Decorative grid lines -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background grid (optional, bisa dihapus kalau mau polos) -->
  <!-- <rect x="0" y="0" width="700" height="160" fill="url(#grid)" /> -->

  <!-- Icon top-left -->
  <g transform="translate(40 35)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Thin accent lines -->
  <!-- <line x1="80" y1="45" x2="660" y2="45" stroke="rgba(0,0,0,0.25)" stroke-width="1"/> -->
  <!-- <line x1="80" y1="115" x2="660" y2="115" stroke="rgba(0,0,0,0.15)" stroke-width="1"/> -->

  <!-- Main Text -->
  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="68"
    font-weight="800"
    letter-spacing="4"
    font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
    fill="#000000">
    JASA MEDIKA
  </text>

  <!-- Subtle underline -->
  <!-- <rect x="220" y="102" width="260" height="3" fill="#000" opacity="0.9"/> -->
</svg>
